# =============================================================================
# Grafana - provisioning datasource automatico
# -----------------------------------------------------------------------------
# Questo file viene letto da Grafana all'avvio (montato in
# /etc/grafana/provisioning/datasources) e configura automaticamente le
# due datasource dello stack: Prometheus (metriche) e Loki (log).
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
